# KeSMIS — gzip only (include once inside http { } in nginx.conf)
#
# Install:
#   sudo cp deploy/nginx/gzip.conf /etc/nginx/conf.d/kesmis-gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or add to /etc/nginx/nginx.conf inside http { }:
#   include /etc/nginx/conf.d/kesmis-gzip.conf;
#
# Do NOT also define gzip in sites-available/default — only one place.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;
