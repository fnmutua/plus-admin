# KeSMIS — gzip only (include once inside http { } in nginx.conf)
#
# BEFORE installing, check gzip is not already enabled:
#   sudo grep -rn "gzip on" /etc/nginx/
#
# If gzip is ALREADY in nginx.conf → you do NOT need this file.
# If gzip is NOT enabled anywhere → install with:
#   sudo cp deploy/nginx/gzip.conf /etc/nginx/conf.d/kesmis-gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# NEVER enable gzip in both nginx.conf AND conf.d/kesmis-gzip.conf AND default.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;
