# KeSMIS production nginx site config
# Install: sudo cp deploy/nginx/kesmis.conf /etc/nginx/sites-available/kesmis
#          sudo ln -sf /etc/nginx/sites-available/kesmis /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Node (production.js) listens on 8443 HTTPS behind this proxy.

upstream kesmis_node {
    server 127.0.0.1:8443;
    keepalive 32;
}

# gzip: use deploy/nginx/gzip.conf in /etc/nginx/conf.d/ instead (avoid duplicate gzip on)

# Optional brotli (requires ngx_brotli module — uncomment if installed)
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name kesmis.go.ke www.kesmis.go.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kesmis.go.ke www.kesmis.go.ke;

    ssl_certificate     /etc/letsencrypt/live/kesmis.go.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kesmis.go.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200m;

    # Hashed build assets — long cache (filenames change on each deploy)
    location ~* ^/assets/.+\.[0-9a-f]{8,}\.(js|mjs|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        proxy_pass https://kesmis_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass https://kesmis_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
