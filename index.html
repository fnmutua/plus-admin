<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= title %></title>
    
    <!-- Default Meta Tags -->
    <meta name="description" content="Kenya Slum Management Information System (KeSMIS) - National geodatabase for slums and informal settlements across Kenya. Real-time data collection, storage, and visualization platform for urban planning and development." />
    <meta name="keywords" content="Kenya slums, informal settlements, urban planning, KISIP, geodatabase, slum management, data collection, Kenya housing, urban development, settlement mapping" />
    <meta name="author" content="Kenya Informal Settlements Improvement Project (KISIP)" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph tags (for WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:title" content="KeSMIS | Kenya Slum Management Information System" />
    <meta property="og:description" content="National geodatabase for slums and informal settlements across Kenya. Real-time data collection, storage, and visualization platform." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kesmis.go.ke" />
    <meta property="og:image" content="https://kesmis.go.ke/logo-seo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KeSMIS Logo - Kenya Slum Management Information System" />
    <meta property="og:site_name" content="KeSMIS" />
    <meta property="og:locale" content="en_KE" />
    
    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KeSMIS - Kenya Slum Management Information System" />
    <meta name="twitter:description" content="National geodatabase for slums and informal settlements across Kenya. Real-time data collection and visualization platform." />
    <meta name="twitter:image" content="https://kesmis.go.ke/twitter-card.jpg" />
    <meta name="twitter:image:alt" content="KeSMIS Logo - Kenya Slum Management Information System" />
    
    <!-- Additional meta tags for better SEO -->
    <meta name="theme-color" content="#684035" />
    <meta name="msapplication-TileColor" content="#684035" />
    <meta name="format-detection" content="telephone=no" />
      
    <!-- ... -->
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          display: flex;
          width: 100%;
          height: 100%;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          background: #f0f2f5;
        }

        .app-loading .app-loading-wrap {
          position: absolute;
          top: 50%;
          left: 50%;
          display: flex;
          -webkit-transform: translate3d(-50%, -50%, 0);
          transform: translate3d(-50%, -50%, 0);
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }

        .app-loading .app-loading-title {
          margin-bottom: 30px;
          font-size: 20px;
          font-weight: bold;
          text-align: center;
        }

        .app-loading .app-loading-logo {
          width: 100px;
          margin: 0 auto 15px auto;
        }

        .app-loading .app-loading-item {
          position: relative;
          display: inline-block;
          width: 60px;
          height: 60px;
          vertical-align: middle;
          border-radius: 50%;
        }

        .app-loading .app-loading-outter {
          position: absolute;
          width: 100%;
          height: 100%;
          border: 4px solid #08f327;
          border-bottom: 0;
          border-left-color: transparent;
          border-radius: 50%;
          animation: loader-outter 1s cubic-bezier(0.42, 0.61, 0.58, 0.41) infinite;
        }

        .app-loading .app-loading-inner {
          position: absolute;
          top: calc(50% - 20px);
          left: calc(50% - 20px);
          width: 40px;
          height: 40px;
          border: 4px solid #ee0a0a;
          border-right: 0;
          border-top-color: transparent;
          border-radius: 50%;
          animation: loader-inner 1s cubic-bezier(0.42, 0.61, 0.58, 0.41) infinite;
        }

        .app-loading .app-loading-inner2 {
          position: absolute;
          top: calc(50% - 10px);
          left: calc(50% - 10px);
          width: 20px;
          height: 20px;
          border: 4px solid #080808;
          border-right: 0;
          border-top-color: transparent;
          border-radius: 50%;
          animation: loader-inner2 1s cubic-bezier(0.42, 0.61, 0.58, 0.41) infinite;
        }

        @-webkit-keyframes loader-outter {
          0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
          }

          100% {
            -webkit-transform: rotate(360deg);
            transform: rotate(360deg);
          }
        }

        @keyframes loader-outter {
          0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
          }

          100% {
            -webkit-transform: rotate(360deg);
            transform: rotate(360deg);
          }
        }

        @-webkit-keyframes loader-inner {
          0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
          }

          100% {
            -webkit-transform: rotate(-360deg);
            transform: rotate(-360deg);
          }
        }

        @keyframes loader-inner {
          0% {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
          }

          100% {
            -webkit-transform: rotate(-360deg);
            transform: rotate(-360deg);
          }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-wrap">
          <div class="app-loading-title">
            <img src="/loader.svg" class="app-loading-logo" alt="Logo" />
            <div class="app-loading-title"><%= title %></div>
          </div>
          <!-- <div class="app-loading-item">
            <div class="app-loading-outter"></div>
            <div class="app-loading-inner"></div>
            <div class="app-loading-inner2"></div>
          </div> -->
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
