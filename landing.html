<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeSMIS</title>
    <meta name="description" content="Kenya Slum Management Information System (KeSMIS) - National geodatabase for slums and informal settlements across Kenya." />
    <meta name="theme-color" content="#00843d" />
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          display: flex;
          width: 100%;
          height: 100%;
          min-height: 100vh;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          background: #f0f2f5;
        }
        .app-loading-wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }
        .app-loading-logo {
          width: min(280px, 72vw);
          height: auto;
          max-height: 72px;
          object-fit: contain;
        }
        .app-loading-title {
          font-size: 20px;
          font-weight: 700;
          text-align: center;
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-wrap">
          <img
            src="/landing/kesmis-exact-logo.png"
            class="app-loading-logo"
            alt="KeSMIS — Kenya Slum Management Information System"
            width="280"
            height="70"
          />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
